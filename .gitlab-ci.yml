deployStagingFirebase:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: deploy
  environment:
    name: staging # Sets the environment name to 'staging'.
  dependencies:
    - buildStagingFirebase
  needs:
    - job: buildStagingFirebase
      artifacts: true
  before_script:
    # Setup bundler (from .setup_bundler template)
    - chmod +x scripts/setup_bundler.sh
    - scripts/setup_bundler.sh
    # Install Firebase CLI for deployment
    - curl -sL https://firebase.tools | bash
  script:
    # Deploy to Firebase App Distribution
    - bundle exec fastlane deployStagingFirebase
  rules:
    # Automatic on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Allow manual trigger from merge requests (before merge)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

