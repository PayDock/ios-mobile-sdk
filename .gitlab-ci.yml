# Stages:
# Defines the stages of the pipeline. Jobs within the same stage run in parallel.
# Jobs in subsequent stages run after the previous stage has completed successfully.
stages:
  - quality # Stage for code quality checks (e.g., linting, static analysis).
  - config # Stage for fetching external configs (BIN file from CloudFront).
  - test # Stage for running unit and integration tests.
  - build # Stage for building the iOS application.
  - deploy # Stage for deploying builds to Firebase and TestFlight.
  - tag # Stage for tagging a release.
  - gitlab_release # Stage for creating a release in GitLab.
  - github_release # Stage for creating a release in GitHub.

include:
  - project: 'paydock/platform/gitlab-templates'
    ref: main
    file: '/security/gitlab-defectdojo.yaml'

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  GIT_STRATEGY: clone
  # Note: RUBYOPT for kconv is not set here because nkf gem needs to be installed first
  # The setup_bundler.sh script handles this properly
  
.macos_saas_runners:
  tags:
    - saas-macos-large-m2pro
  image: macos-26-xcode-26

# .setup_bundler:
# This is a hidden job template that sets up the Ruby Bundler environment.
# It is used by other jobs to ensure they have the necessary Ruby dependencies.
.setup_bundler:
  cache:
    paths:
      - vendor/bundle # Caches the Ruby dependencies to speed up subsequent runs.
  before_script:
    - chmod +x scripts/setup_bundler.sh # Ensure it is executable in CI
    - scripts/setup_bundler.sh # Run the script
  script:
    - bundle --version # Checks the version of Bundler.

# .setup_keychain:
# This is a hidden job template that sets up a temporary keychain for code signing.
# It is used by build jobs to ensure they have the necessary keychain for signing.
# Includes bundler setup and cache for Ruby dependencies.
.setup_keychain:
  cache:
    paths:
      - vendor/bundle # Caches the Ruby dependencies to speed up subsequent runs.
  before_script:
    - chmod +x scripts/setup_bundler.sh
    - scripts/setup_bundler.sh
    # Create temporary keychain for code signing
    - security create-keychain -p ci_password ci_keychain.keychain
    - security set-keychain-settings -lut 3600 ci_keychain.keychain
    - security default-keychain -s ci_keychain.keychain
    - security unlock-keychain -p ci_password ci_keychain.keychain

runLint:
  variables:
    CODE_CLIMATE_REPORT_PATH: "fastlane/swiftlint_report.json"
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: quality
  before_script:
    - brew install swiftlint
    - brew install gnu-sed
    - chmod +x scripts/setup_bundler.sh
    - scripts/setup_bundler.sh
  script:
    - bundle exec fastlane lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - "$CODE_CLIMATE_REPORT_PATH"
    reports:
      codequality: "$CODE_CLIMATE_REPORT_PATH"

run_ExampleApp_tests:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: test
  script:
    # Allow SwiftPM plugins in CI
    - defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
    - bundle exec fastlane test
    - mv fastlane/test_output/report.junit fastlane/test_output/report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    expire_in: 7 days
    when: always
    reports:
      junit: fastlane/test_output/report.xml
    paths:
      - fastlane/test_output

# run_MobileSDK_tests:
# Runs the MobileSDK unit tests and generates coverage reports.
# Coverage comparison is automatically shown in MRs by GitLab.
run_MobileSDK_tests:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: test
  script:
    # Allow SwiftPM plugins in CI
    - defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
    - defaults read com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation || true
    - bundle exec fastlane testPackage
    - mv fastlane/test_output/report.junit fastlane/test_output/report.xml
    # Generate coverage reports in multiple formats
    - xcrun xccov view --report --json fastlane/test_output/MobileSDK.xcresult > fastlane/test_output/coverage.json
    - "COVERAGE=$(xcrun xccov view --report fastlane/test_output/MobileSDK.xcresult | grep 'MobileSDK ' | awk '{print $2}'); echo Coverage: $COVERAGE"
    # Convert to Cobertura XML format for GitLab coverage visualization
    - python3 scripts/xccov-to-cobertura.py fastlane/test_output/coverage.json > fastlane/test_output/cobertura.xml
    # Generate HTML coverage report
    - python3 scripts/generate-coverage-html.py fastlane/test_output/coverage.json fastlane/test_output/coverage-html
  coverage: '/\d+\.\d+%/'
  rules:
    - when: on_success
  artifacts:
    expire_in: 7 days
    when: always
    reports:
      junit: fastlane/test_output/report.xml
      coverage_report:
        coverage_format: cobertura
        path: fastlane/test_output/cobertura.xml
    paths:
      - fastlane/test_output

# GitLab Pages job to publish HTML coverage reports
# This makes the coverage report accessible via GitLab Pages URL
pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - run_MobileSDK_tests
  needs:
    - job: run_MobileSDK_tests
      artifacts: true
  script:
    - echo "Publishing coverage report to GitLab Pages"
    - mkdir -p public
    - ls -la fastlane/test_output/ || echo "No test_output directory"
    - ls -la fastlane/test_output/coverage-html/ || echo "No coverage-html directory"
    - cp -r fastlane/test_output/coverage-html/* public/ 2>/dev/null || echo "No coverage HTML report found, creating placeholder"
    - test -f public/index.html || echo "<html><body><h1>Coverage Report Not Available</h1><p>Coverage report will be available after the next successful test run on main branch.</p></body></html>" > public/index.html
    - ls -la public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# fetch_bin_file:
# Fetches the BIN validation file from CloudFront using HTTP caching headers.
# Uses Last-Modified (preferred) or ETag to determine if the file has changed.
# Mirrors the caching logic in BinDataCacheManager for consistency.
# Runs on all MRs to ensure branches have the latest bin file before merging.
fetch_bin_file:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: config
  script:
    - bundle exec fastlane fetch_bin_file
  artifacts:
    paths:
      - bin_schema/
    expire_in: 1 day
  rules:
    # Run on any merge request (ensures bin file is up to date on all branches)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    # Run automatically when commits land on default branch (keeps file up to date)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# commit_bin_file:
# Commits the fetched card schemes file to the repository if it has changed.
# Updates BIN_FILE_LAST_MODIFIED and BIN_FILE_ETAG CI variables after successful commit.
# Uses [skip ci] in commit message to prevent infinite pipeline loops.
commit_bin_file:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: config
  dependencies:
    - fetch_bin_file
  needs:
    - job: fetch_bin_file
      artifacts: true
  script:
    - bundle exec fastlane commit_bin_file
  rules:
    # Run on any merge request (commits updated bin file to source branch)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    # Run automatically when commits land on default branch (keeps file up to date)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

# Prepare build number for staging (shared between Firebase and TestFlight)
prepareStaging:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: build
  script:
    # Prepare build number (increments once, shared by both Firebase and TestFlight builds)
    # Fastlane will update GitLab CI/CD variable BUILD_NUMBERS_STAGING via API
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "❌ ERROR: GITLAB_TOKEN is not set! Cannot update build numbers."
        echo "Please add GITLAB_TOKEN as a CI/CD variable with 'api' scope."
        exit 1
      else
        echo "✅ GITLAB_TOKEN is set. Build numbers will be updated in GitLab CI/CD variable BUILD_NUMBERS_STAGING"
      fi
    - bundle exec fastlane prepareStaging
    - |
      echo "✅ Build number preparation completed"
      echo "Build numbers are stored in GitLab CI/CD variable BUILD_NUMBERS_STAGING"
      echo "The variable will be available to subsequent jobs in this pipeline"
  rules:
    # Automatically run on merge requests targeting protected branches (main or release)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Prepare build number for sandbox (shared between Firebase and TestFlight)
prepareSandbox:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: build
  script:
    # Prepare build number (increments once, shared by both Firebase and TestFlight builds)
    # Fastlane will update GitLab CI/CD variable BUILD_NUMBERS_SANDBOX via API
    - |
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "❌ ERROR: GITLAB_TOKEN is not set! Cannot update build numbers."
        echo "Please add GITLAB_TOKEN as a CI/CD variable with 'api' scope."
        exit 1
      else
        echo "✅ GITLAB_TOKEN is set. Build numbers will be updated in GitLab CI/CD variable BUILD_NUMBERS_SANDBOX"
      fi
    - bundle exec fastlane prepareSandbox
    - |
      echo "✅ Build number preparation completed"
      echo "Build numbers are stored in GitLab CI/CD variable BUILD_NUMBERS_SANDBOX"
      echo "The variable will be available to subsequent jobs in this pipeline"
  rules:
    # Manually run on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    # Automatically run on merge requests from "deploy/*" branches targeting "release"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^deploy\// && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
      when: on_success
      allow_failure: false
  allow_failure: true
   
buildStagingFirebase:
  extends:
    - .macos_saas_runners
    - .setup_keychain
  stage: build
  script:
    # Setup code signing with temporary keychain
    # Use Ad Hoc profiles for Firebase App Distribution (allows direct download)
    - bundle exec fastlane match adhoc --readonly --keychain_name ci_keychain.keychain --keychain_password ci_password
    # Build only (no deployment) - Firebase build with Ad Hoc profiles
    # Build number is managed by prepareStaging job (shared with TestFlight)
    - bundle exec fastlane buildReleaseStagingFirebase
  artifacts:
    paths:
      - fastlane/builds/staging/firebase
    expire_in: 30 days
  rules:
    # Automatically run when merge request is merged to main (push event to main branch)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Automatically runs on merge request change
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
      allow_failure: false
  allow_failure: true

buildStagingTestflight:
  extends:
    - .macos_saas_runners
    - .setup_keychain
  stage: build
  script:
    # Setup code signing with temporary keychain
    # Use App Store profiles for TestFlight distribution
    - bundle exec fastlane match appstore --readonly --keychain_name ci_keychain.keychain --keychain_password ci_password
    # Build only (no deployment) - TestFlight build with App Store profiles
    # Build number is managed by prepareStaging job (shared with Firebase)
    - bundle exec fastlane buildReleaseStagingTestflight
  artifacts:
    paths:
      - fastlane/builds/staging/testflight
    expire_in: 30 days
  rules:
    # Manual on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Allow manual trigger for other merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

buildSandboxFirebase:
  extends:
    - .macos_saas_runners
    - .setup_keychain
  stage: build
  script:
    # Setup code signing with temporary keychain
    # Use Ad Hoc profiles for Firebase App Distribution (allows direct download)
    - bundle exec fastlane match adhoc --readonly --keychain_name ci_keychain.keychain --keychain_password ci_password
    # Build only (no deployment) - Firebase build with Ad Hoc profiles
    # Build number is managed by prepareSandbox job (shared with TestFlight)
    - bundle exec fastlane buildReleaseSandboxFirebase
  artifacts:
    paths:
      - fastlane/builds/sandbox/firebase
    expire_in: 30 days
  rules:
    # Manual on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Allow manual trigger for other merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

buildSandboxTestflight:
  extends:
    - .macos_saas_runners
    - .setup_keychain
  stage: build
  script:
    # Setup code signing with temporary keychain
    # Use App Store profiles for TestFlight distribution
    - bundle exec fastlane match appstore --readonly --keychain_name ci_keychain.keychain --keychain_password ci_password
    # Build only (no deployment) - TestFlight build with App Store profiles
    # Build number is managed by prepareSandbox job (shared with Firebase)
    - bundle exec fastlane buildReleaseSandboxTestflight
  artifacts:
    paths:
      - fastlane/builds/sandbox/testflight
    expire_in: 30 days
  rules:
    # Automatic on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: on_success
    # Manual on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Automatically run on merge requests from "deploy/*" branches targeting "release"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^deploy\// && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
      when: on_success
      allow_failure: false
    # Manual trigger for other merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

deployStagingFirebase:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: deploy
  environment:
    name: staging
  dependencies:
    - buildStagingFirebase
  needs:
    - job: buildStagingFirebase
      artifacts: true
  script:
    # Install Firebase CLI for deployment
    - curl -sL https://firebase.tools | bash
    # Deploy to Firebase App Distribution
    - bundle exec fastlane deployStagingFirebase
  rules:
    # Automatic on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Allow manual trigger from merge requests (before merge)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

deployStagingTestflight:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: deploy
  environment:
    name: staging
  dependencies:
    - buildStagingTestflight
  needs:
    - job: buildStagingTestflight
      artifacts: true
  script:
    - bundle exec fastlane deployStagingTestflight
  rules:
    # Manual on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Allow manual trigger from merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

deploySandboxFirebase:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: deploy
  environment:
    name: sandbox
  dependencies:
    - buildSandboxFirebase
  needs:
    - job: buildSandboxFirebase
      artifacts: true
  script:
    # Install Firebase CLI for deployment
    - curl -sL https://firebase.tools | bash
    # Deploy to Firebase App Distribution
    - bundle exec fastlane deploySandboxFirebase
  rules:
    # Manual on main branch commits (requires buildSandboxFirebase to run first)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Allow manual trigger from merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

deploySandboxTestflight:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: deploy
  environment:
    name: sandbox
  dependencies:
    - buildSandboxTestflight
  needs:
    - job: buildSandboxTestflight
      artifacts: true
  script:
    - bundle exec fastlane deploySandboxTestflight
  rules:
    # Manual on main branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    # Manual on release branch commits
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: manual
    # Automatically run on merge requests from "deploy/*" branches targeting "release"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^deploy\// && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
      when: on_success
      allow_failure: false
    # Allow manual trigger from other merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

# tag_release:
# This job tags a release in the repository.
tag_release:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: tag
  script:
    - bundle exec fastlane tag_release
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: on_success

# create_gitlab_release:
# This job creates a release in GitLab.
# Version is determined by Fastlane from Xcode project or git tags.
create_gitlab_release:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: gitlab_release
  needs:
    - job: tag_release
  script:
    - bundle exec fastlane create_gitlab_release
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: on_success

# create_github_release:
# This job creates a release in GitHub.
# Version is determined by Fastlane from Xcode project or git tags.
create_github_release:
  extends:
    - .macos_saas_runners
    - .setup_bundler
  stage: github_release
  needs:
    - job: tag_release
  script:
    - bundle exec fastlane create_github_release
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: on_success
