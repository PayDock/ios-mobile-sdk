# Stages:
# Defines the stages of the pipeline. Jobs within the same stage run in parallel.
# Jobs in subsequent stages run after the previous stage has completed successfully.
stages:
  - quality # Stage for code quality checks (e.g., linting, static analysis).
  - test # Stage for running unit and integration tests.
  - build # Stage for building the iOS application.
  - tag # Stage for tagging a release.
  - gitlab_release # Stage for creating a release in GitLab.
  - github_release # Stage for creating a release in GitHub.

include:
  - project: 'paydock/platform/gitlab-templates'
    ref: main
    file: '/security/gitlab-defectdojo.yaml'

variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  GIT_STRATEGY: clone

#before_script:
#  - gem install bundler
#  - bundle install

.macos_saas_runners:
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15

runLint:
  variables:
    CODE_CLIMATE_REPORT_PATH: "fastlane/swiftlint_report.json"
  extends:
    - .macos_saas_runners
    
  stage: quality
  before_script:
    - brew install swiftlint
    - brew install gnu-sed
  script:
   - fastlane lint
  rules:
   - if: '$CI_PIPELINE_SOURCE == "push"'
   - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  artifacts:
    when: always
    paths:
      - "$CODE_CLIMATE_REPORT_PATH"
    reports:
      codequality: "$CODE_CLIMATE_REPORT_PATH"

run_ExampleApp_tests:
  extends:
    - .macos_saas_runners
  stage: test
  script:
    # 👇 Allow SwiftPM plugins in CI
    - defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

    - fastlane test
    - mv fastlane/test_output/report.junit fastlane/test_output/report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    reports:
      junit: fastlane/test_output/report.xml
    paths:
      - fastlane/test_output

run_MobileSDK_tests:
  extends:
    - .macos_saas_runners
  stage: test
  script:
    # 👇 Allow SwiftPM plugins in CI
    - defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
    # Optional sanity: confirm setting was applied
    - defaults read com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation || true

    - fastlane testPackage
    - mv fastlane/test_output/report.junit fastlane/test_output/report.xml

    - xcrun xccov view --report --json fastlane/test_output/MobileSDK.xcresult > fastlane/test_output/coverage.json
    - "COVERAGE=$(xcrun xccov view --report fastlane/test_output/MobileSDK.xcresult | grep 'MobileSDK ' | awk '{print $2}'); echo Coverage: $COVERAGE"
  coverage: '/\d+\.\d+%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    reports:
      junit: fastlane/test_output/report.xml
    paths:
      - fastlane/test_output

# pull_bin_file:
# This job pulls a zip file from an AWS S3 bucket and extracts its contents.
pull_bin_file:
  stage: build # Runs in the 'build' stage.
  # image: 412245956714.dkr.ecr.ap-southeast-2.amazonaws.com/ci:20241212-1584910654
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  script: |
    mkdir -p bin_schema
    aws s3 cp s3://pd-app-bin-management-staging-11/bins.zip bin_schema/bins.zip
    cd bin_schema && unzip -o bins.zip && cd ..
  artifacts:
    paths:
      - bin_schema/ # Makes the 'bin_schema/' directory available as an artifact for subsequent jobs.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: on_success
      
# commit_bin_file:
# This job commits the extracted card schemes file to the repository if it has changed.
commit_bin_file:
  extends:
    - .macos_saas_runners
  stage: build # Runs in the 'build' stage after pull_bin_file.
  dependencies:
    - pull_bin_file # Depends on the pull_bin_file job
  needs:
    - job: pull_bin_file
      artifacts: true
  before_script:
    - gem install bundler
    - bundle config set path 'vendor/bundle'
    - bundle install
  script:
    - bundle exec fastlane commit_bin_file # Executes the 'commit_bin_file' lane in Fastlane
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: on_success
   
